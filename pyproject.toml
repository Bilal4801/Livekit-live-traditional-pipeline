[project]
name = "livekit-live-traditional-pipeline"
version = "2.0.0"
description = "Bidirectional live voice translation with Twilio, LiveKit, and a streaming Deepgram -> OpenAI -> ElevenLabs pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,deepgram,elevenlabs]~=1.8.5",
    "livekit-api>=1.2.1",
    "livekit>=1.1.20",
    "openai>=2.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
    "twilio>=9.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
translation-api = "src.api_server:main"
translation-agent = "src.agent_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
